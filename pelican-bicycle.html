<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1ede7">
  <meta name="description" content="一只鹈鹕骑着自行车，沿着海岸慢慢前行。独立 SVG 动画。">
  <title>鹈鹕的海岸假日</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #234d51;
      --muted: #66827d;
      --paper: #f7faf3;
      --lagoon: #397e87;
      --coral: #e97660;
      --line: #ccdad0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #e1ede7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 5px;
    }
    .page {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 30px 36px 22px;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 2px 24px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 46px; height: 46px; flex: none; }
    .brand h1 { font-size: 20px; font-weight: 600; letter-spacing: .06em; margin: 0 0 6px; }
    .brand p { margin: 0; font-size: 10px; letter-spacing: .24em; color: var(--muted); }
    .weather { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .08em; }
    .weather svg { width: 22px; height: 22px; }
    .postcard {
      overflow: hidden;
      border: 1px solid #d1dfd4;
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 48px #345d4810, 0 3px 6px #345d4806;
    }
    .scene { position: relative; aspect-ratio: 1440 / 820; overflow: hidden; background: #deeee3; }
    .landscape { display: block; width: 100%; height: 100%; }
    .scene-caption { position: absolute; z-index: 1; left: 4.4%; top: 7%; pointer-events: none; }
    .scene-caption p { margin: 0 0 16px; font-size: 11px; letter-spacing: .24em; color: #4a7879; }
    .scene-caption h2 {
      margin: 0;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      font-size: clamp(28px, 3.35vw, 46px);
      font-weight: 500;
      line-height: 1.48;
      letter-spacing: .08em;
      color: #2b6063;
    }
    .scene-caption .little-line { display: block; width: 38px; height: 2px; margin-top: 22px; background: #e6a25f; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px 28px;
      border-top: 1px solid #e3e6d8;
    }
    .actions { display: flex; align-items: center; gap: 10px; }
    .control-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 11px;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      transition: background .18s, transform .18s;
    }
    .control-button:hover { background: #e8efe5; transform: translateY(-1px); }
    .control-button:active { transform: translateY(1px); }
    .control-button.primary { min-width: 112px; border-color: var(--ink); background: var(--ink); color: #fff9e9; }
    .control-button.primary:hover { background: #326469; }
    .control-button svg { width: 18px; height: 18px; flex: none; }
    .speed-control { display: flex; align-items: center; gap: 13px; font-size: 12px; }
    .speed-control label { color: var(--muted); white-space: nowrap; }
    .speed-control input { width: 150px; height: 24px; margin: 0; accent-color: var(--lagoon); cursor: pointer; }
    .speed-control output { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    .footnote { display: flex; justify-content: space-between; gap: 16px; margin: 17px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .footnote p { margin: 0; }
    kbd { font: inherit; border-bottom: 1px solid #b7ccc0; padding: 0 3px 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (min-width: 1500px) { .page { padding-top: 42px; } }
    @media (max-width: 700px) {
      .page { padding: 20px 16px; }
      .masthead { padding-bottom: 18px; }
      .brand h1 { font-size: 17px; }
      .brand p { font-size: 8px; }
      .brand-mark { width: 39px; height: 39px; }
      .weather span { display: none; }
      .postcard { border-radius: 18px; }
      .scene { aspect-ratio: 4 / 5; }
      .scene-caption { top: 5%; left: 7%; }
      .scene-caption p { font-size: 9px; margin-bottom: 10px; }
      .scene-caption h2 { font-size: clamp(16px, 5.4vw, 28px); line-height: 1.35; }
      .scene-caption .little-line { margin-top: 15px; width: 28px; }
      .controls { padding: 16px; gap: 17px; }
      .actions { flex: 1; }
      .speed-control { flex: 1; min-width: 240px; }
      .speed-control input { flex: 1; width: 100px; }
      .footnote { font-size: 10px; }
      .shortcuts { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .control-button { transition: none; }
    }
  </style>
</head>

            <path id="scarf-tail-back" d="M722 306C690 285 665 312 631 297L608 302 626 315C665 335 695 315 721 327Z" fill="#438b8b" stroke="#356e70" stroke-width="2.5"/>
            <path id="scarf-tail-front" d="M715 309C680 319 647 312 616 326L624 340C659 325 688 338 725 323Z" fill="#5d9e98" stroke="#356e70" stroke-width="2.5"/>
            <path d="M718 342C755 351 806 386 844 390L847 401C799 405 754 383 724 373Z" fill="#d7dfd0" stroke="#66877c" stroke-width="3"/>
            <path d="M575 385C548 378 519 362 501 338L551 350 522 328C558 334 584 354 597 367Z" fill="#edf0dd" stroke="#66877c" stroke-width="3"/>
            <path d="M525 347 557 367M542 345 568 365" fill="none" stroke="#b6c7b5" stroke-width="2"/>
            <path d="M548 359C571 330 610 327 647 336C667 341 683 343 692 327C701 311 696 290 699 266C702 231 716 207 736 201C759 194 787 206 795 226C808 246 790 266 768 280C749 292 746 310 751 328C753 346 773 361 770 383C773 415 735 444 692 449C648 456 599 440 571 410C552 391 539 378 548 359Z" fill="url(#feathers)" stroke="#66877c" stroke-width="3"/>
            <path d="M555 379C568 416 620 445 674 442C694 440 715 434 728 425C690 433 653 420 628 403C597 407 569 395 555 379Z" fill="#d4ddcb" opacity=".53"/>
            <path d="M574 392q16 20 35 24m-17-24q14 20 32 23m-13-18q14 17 30 19" fill="none" stroke="#bacbb8" stroke-width="2.5"/>
            <path d="M718 263Q713 291 723 309" fill="none" stroke="#fffef4" stroke-width="8" opacity=".8"/>
            <path d="M704 293Q724 306 752 301L755 318Q732 328 703 313Z" fill="#3f898c" stroke="#356d70" stroke-width="2.5"/>
            <path d="M708 299Q728 311 750 307" fill="none" stroke="#a0c6b5" stroke-width="3"/>
            <path d="M711 308q-14-4-12 7t15 7q10-4-3-14Z" fill="#367c7d" stroke="#326c70" stroke-width="2"/>
            <path d="M714 210Q704 203 699 214Q709 212 716 221" fill="#fffbed" stroke="#66877c" stroke-width="2"/>
            <path d="M711 209Q715 185 746 184Q777 182 787 207Z" fill="#43868b" stroke="#356d70" stroke-width="3"/>
            <path d="M715 202Q751 193 785 205" fill="none" stroke="#a2c8ba" stroke-width="4"/>
            <path d="M748 185Q737 194 740 200" fill="none" stroke="#78aaa1" stroke-width="2"/>
            <circle cx="748" cy="183" r="3" fill="#336e73"/>
            <path d="M779 205Q799 203 812 215L790 220 779 214Z" fill="#356e76" stroke="#356d70" stroke-width="2"/>
            <path d="M792 249 984 258C959 291 900 326 857 315C825 307 804 278 792 249Z" fill="url(#pouch-shade)" stroke="#b48146" stroke-width="2.8"/>
            <path d="M808 265Q830 299 862 306" fill="none" stroke="#f9d28b" stroke-width="4" opacity=".75"/>
            <path d="M789 235Q876 234 987 252Q1000 255 992 264L789 252Z" fill="#f6c768" stroke="#b48146" stroke-width="2.5"/>
            <path d="M802 241Q890 242 979 255" fill="none" stroke="#ffe2a1" stroke-width="2.5"/>
            <path d="M986 253Q1002 258 991 275L984 262" fill="#e9a24d" stroke="#b48146" stroke-width="2"/>
            <path d="M798 252 979 261" fill="none" stroke="#ba854b" stroke-width="1.7"/>
            <ellipse cx="818" cy="244" rx="4" ry="1.6" fill="#bb8b4e"/>
            <circle cx="778" cy="254" r="8" fill="#e4b68c" opacity=".28"/>
            <path d="M735 252q-3 10 4 13" fill="none" stroke="#bac9b4" stroke-width="2"/>
            <path d="M764 219q8-4 15 0" fill="none" stroke="#53786e" stroke-width="2.5"/>
            <g id="pelican-eye" transform="translate(772 233)">
              <ellipse rx="6.2" ry="7.5" fill="#274e50"/>
              <circle cx="1.6" cy="-2.7" r="1.8" fill="#fffdf1"/>
            </g>
            <path id="riding-wing" d="M632 349C662 343 686 367 706 383C747 406 792 409 833 394Q847 388 850 398L841 411C809 432 757 431 710 412C691 428 656 414 640 393C629 377 625 360 632 349Z" fill="url(#wing-shade)" stroke="#66877c" stroke-width="3"/>
            <path d="M651 368Q666 395 690 401M667 367Q681 391 708 399M699 393Q749 420 792 414" fill="none" stroke="#b8c9b6" stroke-width="2.7"/>
            <path d="M815 408 838 402M808 414 833 409" fill="none" stroke="#b8c9b6" stroke-width="2"/>
          </g>
          <g id="bell-rings" fill="none" stroke="#b9984e" stroke-width="3" stroke-linecap="round" opacity="0" aria-hidden="true">
            <path d="M872 368q7 7 0 14M883 360q14 15 0 30M895 351q20 23 0 46"/>
            <text x="880" y="339" fill="#66847b" stroke="none" font-size="22" font-family="STKaiti, KaiTi, serif">叮铃～</text>
          </g>
          <g id="foreground"><use href="#foreground-tile"/><use href="#foreground-tile" x="900"/><use href="#foreground-tile" x="1800"/></g>
        </svg>
      </div>
      <div class="controls">
        <div class="actions">
          <button id="play-toggle" class="control-button primary" type="button" aria-label="暂停动画" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M5 4h3v12H5zM12 4h3v12h-3z"/></svg>
            <span id="play-label">暂停</span>
          </button>
          <button id="bell-button" class="control-button" type="button" aria-label="按响自行车铃铛">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h12l-1.5-2V8a4.5 4.5 0 0 0-9 0v3L4 13Zm4 3q2 2 4 0M10 2v1"/></svg>
            <span>叮铃</span>
          </button>
        </div>
        <div class="speed-control">
          <label for="ride-speed">骑行速度</label>
          <input id="ride-speed" type="range" min="0.3" max="2.5" step="0.1" value="1" aria-valuetext="1 倍速度">
          <output id="speed-value" for="ride-speed">1.0×</output>
        </div>
      </div>
    </section>
    <footer class="footnote"><p>一只鹈鹕，一辆单车，一段没有终点的海岸线。</p><p class="shortcuts"><kbd>空格</kbd> 暂停 / 继续　<kbd>B</kbd> 响铃</p></footer>
    <p id="sound-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      'use strict';

      const byId = (id) => document.getElementById(id);
      const partIds = [
        'clouds', 'islands', 'waves', 'coast', 'foreground', 'lighthouse',
        'sailboat', 'gull-one', 'gull-two', 'gull-three', 'road-marks',
        'road-grain', 'chain', 'rear-wheel-spin', 'front-wheel-spin',
        'chainring-spin', 'far-crank', 'near-crank', 'far-leg-outline',
        'far-leg', 'near-leg-outline', 'near-leg', 'far-pedal', 'near-pedal',
        'far-foot', 'near-foot', 'pelican-body', 'pelican-eye', 'riding-wing',
        'scarf-tail-back', 'scarf-tail-front', 'bike-shadow', 'bell-rings'
      ];
      const parts = Object.fromEntries(partIds.map((id) => [id, byId(id)]));
      const playButton = byId('play-toggle');
      const speedInput = byId('ride-speed');
      const speedOutput = byId('speed-value');
      const soundStatus = byId('sound-status');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let playing = !reducedMotion;
      let speed = Number(speedInput.value);
      let rideTime = 0;
      let previousFrame = null;
      let bellStarted = -Infinity;
      let audioContext = null;

      const CADENCE = 3.8;
      const DRIVE_RATIO = 1.45;
      const WHEEL_RADIUS = 109;
      const CRANK_RADIUS = 38;
      const CRANK = { x: 695, y: 568 };
      const format = (value) => value.toFixed(2);
      const translate = (x, y = 0) => 'translate(' + format(x) + ' ' + format(y) + ')';

      function setRotation(id, radians) {
        const degrees = radians * 180 / Math.PI % 360;
        parts[id].setAttribute('transform', 'rotate(' + format(degrees) + ')');
      }

      function scrollLayer(id, distance, repeatWidth) {
        parts[id].setAttribute('transform', translate(-(distance % repeatWidth)));
      }

      function wrap(value, minimum, maximum) {
        const width = maximum - minimum;
        return ((value - minimum) % width + width) % width + minimum;
      }

      // 两段式反向运动学：髋部跟随身体起伏，脚踝始终连接到踏板位置。
      // 膝盖选取朝行进方向的解，让双腿在整圈踩踏中保持自然弯曲。
      function legPath(hip, ankle) {
        const upperLength = 82;
        const lowerLength = 88;
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const knee = {
          x: hip.x + dx / distance * along + dy / distance * height,
          y: hip.y + dy / distance * along - dx / distance * height
        };
        const before = { x: knee.x + (hip.x - knee.x) * .16, y: knee.y + (hip.y - knee.y) * .16 };
        const after = { x: knee.x + (ankle.x - knee.x) * .16, y: knee.y + (ankle.y - knee.y) * .16 };
        return `M${format(hip.x)} ${format(hip.y)} L${format(before.x)} ${format(before.y)} Q${format(knee.x)} ${format(knee.y)} ${format(after.x)} ${format(after.y)} L${format(ankle.x)} ${format(ankle.y)}`;
      }

      function moveLeg(side, phase, bob) {
        const pedal = {
          x: CRANK.x + Math.cos(phase) * CRANK_RADIUS,
          y: CRANK.y + Math.sin(phase) * CRANK_RADIUS
        };
        const ankle = { x: pedal.x - 7, y: pedal.y - 13 };
        const hip = side === 'near' ? { x: 668, y: 441 + bob } : { x: 653, y: 437 + bob };
        const path = legPath(hip, ankle);
        parts[side + '-leg'].setAttribute('d', path);
        parts[side + '-leg-outline'].setAttribute('d', path);
        parts[side + '-foot'].setAttribute('transform', translate(ankle.x, ankle.y));
        parts[side + '-pedal'].setAttribute('transform', translate(pedal.x, pedal.y));
        parts[side + '-crank'].setAttribute('x2', format(pedal.x));
        parts[side + '-crank'].setAttribute('y2', format(pedal.y));
      }

      function moveGull(id, x, y, size, phase, time) {
        const lift = -4 - Math.sin(time * 3 + phase) * size * .45;
        const altitude = y + Math.sin(time * 1.4 + phase) * 3;
        parts[id].setAttribute('d', `M${format(x - size)} ${format(altitude)} Q${format(x - size / 2)} ${format(altitude + lift)} ${format(x)} ${format(altitude)} Q${format(x + size / 2)} ${format(altitude + lift)} ${format(x + size)} ${format(altitude)}`);
      }

      function render(time, wallTime) {
        const phase = time * CADENCE - .65;
        const wheelPhase = time * CADENCE * DRIVE_RATIO;
        // 地面位移取车轮转角乘轮胎半径，使车轮滚动与路面后退保持一致。
        const distance = wheelPhase * WHEEL_RADIUS;
        const bob = Math.sin(phase * 2) * 2.6;
        setRotation('rear-wheel-spin', wheelPhase);
        setRotation('front-wheel-spin', wheelPhase);
        setRotation('chainring-spin', phase);
        moveLeg('far', phase + Math.PI, bob);
        moveLeg('near', phase, bob);

        scrollLayer('clouds', distance * .008, 1800);
        scrollLayer('islands', distance * .015, 1800);
        scrollLayer('waves', distance * .085, 1200);
        scrollLayer('coast', distance * .23, 1440);
        scrollLayer('foreground', distance * 1.1, 900);
        parts['road-marks'].setAttribute('stroke-dashoffset', format(distance % 230));
        parts['road-grain'].setAttribute('stroke-dashoffset', format(distance % 384));
        parts.chain.setAttribute('stroke-dashoffset', format(-(time * CADENCE * 29 % 8)));
        parts.lighthouse.setAttribute('transform', translate(wrap(1230 - distance * .025, -260, 1840), 401));
        parts.sailboat.setAttribute('transform', translate(wrap(241 - distance * .075, -100, 1620), 515 + Math.sin(time * 1.6) * 2.5));
        moveGull('gull-one', wrap(1034 - distance * .025, -200, 1640), 304, 24, 0, time);
        moveGull('gull-two', wrap(1098 - distance * .025, -200, 1640), 330, 16, 1.7, time);
        moveGull('gull-three', wrap(295 - distance * .012, -200, 1640), 369, 18, 2.8, time);

        parts['pelican-body'].setAttribute('transform', translate(0, bob));
        parts['bike-shadow'].setAttribute('rx', format(290 - bob * 1.5));
        const flutter = Math.sin(time * 10) * 7;
        const flutterBack = Math.sin(time * 10 - 1.8) * 5;
        parts['scarf-tail-back'].setAttribute('d', `M722 306C690 ${294 + flutterBack} 665 ${312 + flutter} 631 ${297 + flutter}L608 ${302 + flutter} 626 ${315 + flutter}C665 ${335 + flutterBack} 695 315 721 327Z`);
        parts['scarf-tail-front'].setAttribute('d', `M715 309C680 ${319 + flutterBack} 647 ${312 - flutter} 616 ${326 - flutter}L624 ${340 - flutter}C659 ${325 + flutterBack} 688 338 725 323Z`);
        const blinkPhase = (time + .7) % 5.8;
        const eyeScale = blinkPhase > 5.5 ? Math.max(.08, Math.abs((blinkPhase - 5.65) / .15)) : 1;
        parts['pelican-eye'].setAttribute('transform', 'translate(772 233) scale(1 ' + format(eyeScale) + ')');
        // 翅膀末端抵消身体上下起伏，持续搭在车把上。
        parts['riding-wing'].setAttribute('d', `M632 349C662 343 686 367 706 383C747 406 792 ${409 - bob * .65} 833 ${394 - bob}Q847 ${388 - bob} 850 ${398 - bob}L841 ${411 - bob}C809 ${432 - bob * .75} 757 431 710 412C691 428 656 414 640 393C629 377 625 360 632 349Z`);

        const bellAge = wallTime - bellStarted;
        const bellVisible = bellAge >= 0 && bellAge < 1.3;
        parts['bell-rings'].setAttribute('opacity', bellVisible ? format(Math.min(1, bellAge * 10) * (1 - bellAge / 1.3)) : '0');
        if (bellVisible) {
          parts['bell-rings'].setAttribute('transform', translate(Math.sin(bellAge * 35) * 2, -bellAge * 6));
        }
      }

      function updatePlayButton() {
        byId('play-icon').setAttribute('d', playing ? 'M5 4h3v12H5zM12 4h3v12h-3z' : 'M6 3 17 10 6 17Z');
        byId('play-label').textContent = playing ? '暂停' : '继续骑行';
        playButton.setAttribute('aria-label', playing ? '暂停动画' : '继续播放动画');
        playButton.setAttribute('aria-pressed', String(!playing));
      }

      function togglePlayback() {
        playing = !playing;
        updatePlayButton();
      }

      // 点击铃铛后才创建音频上下文；用短促泛音合成铃声，无需音频文件。
      // 浏览器不能播放音频时，画面的铃铛反馈仍然保留。
      async function playBellSound() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioContext ??= new AudioContextClass();
          if (audioContext.state === 'suspended') await audioContext.resume();
          if (audioContext.state !== 'running') return;
          const start = audioContext.currentTime;
          for (const delay of [0, .16]) {
            for (const [frequency, volume] of [[1568, .11], [3136, .035], [4280, .015]]) {
              const oscillator = audioContext.createOscillator();
              const envelope = audioContext.createGain();
              const at = start + delay;
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(frequency, at);
              envelope.gain.setValueAtTime(.0001, at);
              envelope.gain.exponentialRampToValueAtTime(volume, at + .006);
              envelope.gain.exponentialRampToValueAtTime(.0001, at + .85);
              oscillator.connect(envelope);
              envelope.connect(audioContext.destination);
              oscillator.start(at);
              oscillator.stop(at + .9);
              oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
            }
          }
        } catch {
          soundStatus.textContent = '叮铃！当前浏览器未播放声音，画面铃铛已响起。';
        }
      }

      function ringBell() {
        bellStarted = performance.now() / 1000;
        soundStatus.textContent = '叮铃！';
        void playBellSound();
      }

      playButton.addEventListener('click', togglePlayback);
      byId('bell-button').addEventListener('click', ringBell);
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        speedOutput.value = speed.toFixed(1) + '×';
        speedInput.setAttribute('aria-valuetext', speed.toFixed(1) + ' 倍速度');
      });
      document.addEventListener('keydown', (event) => {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.target instanceof Element && event.target.closest('input, textarea, select, button, [contenteditable]')) return;
        if (event.code === 'Space') {
          event.preventDefault();
          togglePlayback();
        } else if (event.key.toLowerCase() === 'b') {
          event.preventDefault();
          ringBell();
        }
      });
      document.addEventListener('visibilitychange', () => { previousFrame = null; });

      function frame(timestamp) {
        const delta = previousFrame === null ? 0 : Math.min((timestamp - previousFrame) / 1000, .05);
        previousFrame = timestamp;
        if (playing) rideTime += delta * speed;
        render(rideTime, timestamp / 1000);
        requestAnimationFrame(frame);
      }

      updatePlayButton();
      render(0, performance.now() / 1000);
      requestAnimationFrame(frame);
    })();
  </script>
