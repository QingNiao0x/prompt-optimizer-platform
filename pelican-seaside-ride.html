<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6efea">
  <title>骑到海风里 · 鹈鹕的自行车日记</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #204c50;
      --muted: #6b8682;
      --paper: #f8faf3;
      --page: #e6efea;
      --sea: #4ba9a2;
      --coral: #e7775e;
      --sun: #f4cf77;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page {
      width: min(1180px, calc(100% - 72px));
      margin: 0 auto;
      padding: 32px 0 24px;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .wordmark { display: flex; align-items: center; gap: 12px; }
    .wordmark svg { width: 39px; height: 39px; }
    .wordmark strong { display: block; font-size: 15px; letter-spacing: 3px; }
    .wordmark small { display: block; margin-top: 5px; font-size: 9px; letter-spacing: 2.3px; }
    .masthead-note { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; }

    .postcard {
      overflow: hidden;
      border: 1px solid #ffffffc9;
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 20px 70px -36px #285c5352, 0 2px 4px #285c5305;
    }

    .scene {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1200 / 760;
      background: #def0e9;
    }

    .scene > svg { display: block; width: 100%; height: 100%; }

    .scene-copy {
      position: absolute;
      z-index: 1;
      top: 7.3%;
      left: 6%;
      pointer-events: none;
    }

    .eyebrow { margin: 0 0 16px; font-size: 10px; letter-spacing: 3px; color: #507973; }

    h1 {
      margin: 0;
      font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", Georgia, serif;
      font-size: clamp(29px, 3.6vw, 48px);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 2px;
    }

    .scene-copy p:last-child { margin: 13px 0 0; font-size: 12px; letter-spacing: 2px; color: #608780; }

    .coastal-stamp {
      position: absolute;
      right: 4.5%;
      bottom: 3%;
      font-family: "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: #6a9184;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 30px;
    }

    .journey { display: flex; align-items: center; gap: 13px; flex-shrink: 0; }
    .journey-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 50%; background: #e8f0e8; }
    .journey-icon svg { width: 21px; height: 21px; }
    .journey strong { display: block; font-size: 13px; font-weight: 500; letter-spacing: 1px; }
    .journey small { display: block; margin-top: 5px; font-size: 10px; color: var(--muted); letter-spacing: 1px; }
    .actions { display: flex; align-items: center; gap: 12px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 43px;
      padding: 0 19px;
      border: 1px solid #dbe6dd;
      border-radius: 24px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      transition: background 160ms ease, transform 160ms ease;
      touch-action: manipulation;
    }

    .button svg { width: 17px; height: 17px; }
    .button:hover { background: #eaf0e6; }
    .button:active { transform: translateY(1px); }
    .button.primary { min-width: 112px; border-color: var(--ink); background: var(--ink); color: var(--paper); }
    .button.primary:hover { background: #316267; }
    :focus-visible { outline: 3px solid var(--coral); outline-offset: 5px; }
    [hidden] { display: none !important; }

    .pace { display: flex; align-items: center; gap: 10px; margin-right: 12px; }
    .pace label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .pace output { width: 32px; font-size: 11px; color: var(--ink); }
    input[type="range"] { width: 94px; height: 28px; margin: 0; accent-color: var(--sea); cursor: pointer; }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding: 0 4px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .footer em { font-family: Georgia, serif; font-size: 12px; letter-spacing: .5px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    @media (max-width: 860px) {
      .page { width: calc(100% - 36px); padding-top: 22px; }
      .controls { padding: 20px; gap: 20px; flex-wrap: wrap; }
      .journey { flex: 1; }
      .actions { flex: 1; justify-content: flex-end; }
      .pace { margin-right: 0; }
      .journey small { font-size: 9px; }
    }

    @media (max-width: 600px) {
      .page { width: calc(100% - 24px); padding-top: 18px; }
      .masthead { margin: 0 8px 19px; }
      .wordmark strong { font-size: 13px; }
      .wordmark svg { width: 33px; height: 33px; }
      .masthead-note { display: none; }
      .postcard { border-radius: 17px; }
      .scene { aspect-ratio: 4 / 5; }
      .scene-copy { top: 7%; left: 7%; }
      h1 { font-size: clamp(26px, 7.4vw, 39px); }
      .eyebrow { margin-bottom: 12px; font-size: 8px; }
      .scene-copy p:last-child { font-size: 10px; margin-top: 10px; letter-spacing: 1px; }
      .coastal-stamp { font-size: 8px; }
      .controls { padding: 20px 17px; gap: 19px; }
      .journey { flex-basis: 100%; }
      .journey strong { font-size: 12px; }
      .actions { justify-content: space-between; gap: 8px; width: 100%; }
      .button { min-height: 42px; padding: 0 12px; gap: 6px; }
      .button.primary { min-width: 88px; }
      .pace { gap: 6px; }
      .pace label { display: none; }
      input[type="range"] { width: 69px; }
      .pace output { font-size: 10px; width: 26px; }
      .footer { font-size: 9px; }
      .footer em { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>

                <path d="M652 256q8-4 14 1" fill="none" stroke="#426961" stroke-width="2"/>
                <path d="M623 248C621 226 638 215 656 219Q678 222 682 245Z" fill="#4c8c84" stroke="#355f5c" stroke-width="2.5"/>
                <path d="M647 220q-7 13 0 26" fill="none" stroke="#dce9cf" stroke-width="7"/>
                <path d="M622 246Q655 243 684 244L703 251Q687 258 666 252L627 253Z" fill="#60998c" stroke="#355f5c" stroke-width="2.5"/>
                <circle cx="649" cy="218" r="3.3" fill="#355f5c"/>
              </g>
            </g>

            <g id="bike-bell">
              <path d="M718 414v-6" stroke="#355f5c" stroke-width="3"/>
              <path d="M709 409a9 9 0 0 1 18 0Z" fill="#f1c666" stroke="#8f8954" stroke-width="2"/>
              <path d="M712 403q3-3 6-2" fill="none" stroke="#fff0b4" stroke-width="2"/>
              <path d="m727 409 4-3" stroke="#355f5c" stroke-width="2.5"/>
            </g>
            <g id="bell-notes" opacity="0" fill="none" stroke="#527e6a" stroke-width="2.5">
              <path d="M734 392q7 3 7 11m2-20q13 6 13 20M708 386q-7 5-7 12"/>
              <path d="M765 378v-15l9-2v12"/>
              <ellipse cx="761" cy="379" rx="4" ry="2.5" fill="#527e6a" stroke="none"/>
              <ellipse cx="770" cy="374" rx="4" ry="2.5" fill="#527e6a" stroke="none"/>
            </g>
          </g>

          <g id="breeze" fill="none" stroke="#fffbee" stroke-width="2.8" stroke-linecap="round" opacity=".8">
            <path d="M345 332h38m-60 13h43m-35 122h24"/>
          </g>
        </svg>
        <span class="coastal-stamp" aria-hidden="true">COASTAL DAYDREAM</span>
      </div>

      <div class="controls">
        <div class="journey">
          <span class="journey-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9h12a3 3 0 1 0-3-3M3 13h16a2 2 0 1 1-2 2M6 17h4"/></svg>
          </span>
          <div><strong id="ride-status">海风正好，正在慢慢骑。</strong><small>骑得慢一点，风景就多一点。</small></div>
        </div>
        <div class="actions">
          <div class="pace">
            <label for="pace">骑行速度</label>
            <input id="pace" type="range" min="0.5" max="1.8" step="0.05" value="1" aria-label="骑行速度" aria-valuetext="悠闲，1 倍速度">
            <output id="pace-label" for="pace">悠闲</output>
          </div>
          <button class="button" id="ring" type="button" aria-label="按响自行车铃">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h14l-2-3V9a5 5 0 0 0-10 0v4Zm5 3a2 2 0 0 0 4 0M12 2v2M3 6 2 9m19-3 1 3"/></svg>
            <span>叮铃</span>
          </button>
          <button class="button primary" id="toggle" type="button" aria-label="暂停骑行" aria-pressed="false">
            <svg id="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg>
            <svg id="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" hidden><path d="M6 3.5a.8.8 0 0 1 1.2-.7l10 6.5a.8.8 0 0 1 0 1.4l-10 6.5a.8.8 0 0 1-1.2-.7Z"/></svg>
            <span id="toggle-label">歇一会儿</span>
          </button>
        </div>
      </div>
      <p class="sr-only" id="announcement" aria-live="polite"></p>
      <noscript><p style="padding: 0 24px 20px; font-size: 13px;">开启浏览器 JavaScript 后，鹈鹕就会开始骑行。</p></noscript>
    </section>

    <footer class="footer"><span>一只鹈鹕 · 一辆单车 · 一整个好天气</span><em>Enjoy the little things.</em></footer>
  </main>

  <script>
    (() => {
      'use strict';

      const byId = (id) => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank-arms', 'far-leg', 'near-leg',
        'near-leg-outline', 'far-pedal', 'near-pedal', 'pelican', 'pelican-head',
        'pelican-eye', 'scarf-tail', 'scarf-tail-back', 'riding-wing', 'wing-feathers',
        'road-marks', 'foreground', 'roadside', 'dunes', 'sea-lines', 'cloud-one',
        'cloud-two', 'cloud-three', 'gull-one', 'gull-two', 'gull-wing-one', 'sailboat',
        'chain', 'breeze', 'bike-shadow', 'bike-bell', 'bell-notes'
      ].map((id) => [id, byId(id)]));

      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let userChosePlayback = false;
      let speed = 1;
      let elapsed = 0;
      let previousTimestamp = null;
      let bellStarted = -Infinity;
      let audioContext = null;
      let redraw = true;

      const attribute = (id, name, value) => elements[id].setAttribute(name, value);
      const translate = (id, x, y = 0) => attribute(id, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

      /** 两段腿骨通过关节求解连接身体与踏板，避免脚掌在踩踏时滑离踏板。 */
      function legPath(hipX, hipY, pedalX, pedalY) {
        const ankleX = pedalX - 5;
        const ankleY = pedalY - 14;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const upperLength = 78;
        const lowerLength = 83;
        const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
        const kneeX = hipX + along * dx / distance - height * dy / distance;
        const kneeY = hipY + along * dy / distance + height * dx / distance;
        return `M${hipX} ${hipY} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${ankleX.toFixed(2)} ${ankleY.toFixed(2)}`;
      }

      /** 踏频、车轮转角和路面距离共用时间轴，因此调速与暂停不会破坏同步。 */
      function drawScene(time, timestamp) {
        const pedalAngle = time * 2.7;
        const wheelAngle = pedalAngle * 1.8;
        const distance = wheelAngle * 81.5;
        const degrees = 180 / Math.PI;
        const bob = Math.sin(pedalAngle * 2) * 1.7;
        const pedalX = Math.cos(pedalAngle) * 29;
        const pedalY = Math.sin(pedalAngle) * 29;

        attribute('rear-spokes', 'transform', `rotate(${wheelAngle * degrees % 360})`);
        attribute('front-spokes', 'transform', `rotate(${wheelAngle * degrees % 360})`);
        attribute('crank-arms', 'transform', `rotate(${pedalAngle * degrees % 360})`);
        translate('near-pedal', 616 + pedalX, 550 + pedalY);
        translate('far-pedal', 616 - pedalX, 550 - pedalY);
        attribute('far-leg', 'd', legPath(563, 438 + bob, 616 - pedalX, 550 - pedalY));
        const nearLeg = legPath(554, 440 + bob, 616 + pedalX, 550 + pedalY);
        attribute('near-leg', 'd', nearLeg);
        attribute('near-leg-outline', 'd', nearLeg);
        attribute('chain', 'stroke-dashoffset', -time * 36);

        translate('pelican', 0, bob);
        attribute('pelican-head', 'transform', `rotate(${Math.sin(time * 1.6) * 1.2} 645 298)`);
        const blinkPhase = time % 5.7;
        const eyeScale = blinkPhase > 5.35 && blinkPhase < 5.55
          ? Math.max(.06, Math.abs(blinkPhase - 5.45) / .1) : 1;
        attribute('pelican-eye', 'transform', `scale(1 ${eyeScale})`);

        // 翅尖抵着固定车把，身体上下运动时在局部坐标中抵消位移。
        attribute('riding-wing', 'd', `M537 380C567 362 596 380 621 400Q654 424 701 ${422 - bob}L717 ${428 - bob} 705 ${433 - bob} 692 ${431 - bob}Q653 446 616 435C586 433 558 412 537 395Z`);
        const flutter = Math.sin(time * 7) * 5;
        const flutterBack = Math.sin(time * 7 - 1.2) * 4;
        attribute('scarf-tail', 'd', `M633 317Q603 ${301 + flutter} 579 ${310 + flutterBack}T532 ${310 + flutter}L543 ${324 + flutter}Q578 ${330 + flutterBack} 597 ${318 + flutter}T633 327Z`);
        attribute('scarf-tail-back', 'd', `M633 324Q596 ${341 + flutterBack} 564 ${318 + flutter}L535 ${324 + flutterBack} 547 ${309 + flutter}Q591 319 630 311Z`);

        translate('road-marks', -(distance % 240));
        translate('foreground', -(distance % 600));
        translate('roadside', -(time * 51 % 1200));
        translate('dunes', -(time * 10 % 1200));
        attribute('sea-lines', 'patternTransform', `translate(${-time * 22 % 194} 0)`);
        attribute('cloud-one', 'transform', `translate(${((745 - time * 8 + 260) % 1600 + 1600) % 1600 - 260} 84) scale(.85)`);
        attribute('cloud-two', 'transform', `translate(${((97 - time * 11 + 260) % 1600 + 1600) % 1600 - 260} 272) scale(1.1)`);
        attribute('cloud-three', 'transform', `translate(${((1082 - time * 6 + 260) % 1600 + 1600) % 1600 - 260} 275) scale(1.2)`);
        translate('sailboat', ((225 - time * 12 + 100) % 1400 + 1400) % 1400 - 100, 462 + Math.sin(time * 1.2) * 2);
        translate('gull-one', 887 + Math.sin(time * .23) * 60, 246 + Math.sin(time * 1.3) * 4);
        translate('gull-two', 847 + Math.sin(time * .23 - .2) * 59, 273 + Math.sin(time * 1.3 - 1) * 3);
        attribute('gull-wing-one', 'd', `M-15 ${Math.sin(time * 3) * 3}Q-8-8 0 0Q8-8 15 ${Math.sin(time * 3) * 3}`);
        translate('breeze', -Math.sin(time * 3) * 8);
        attribute('breeze', 'opacity', .4 + Math.sin(time * 3) * .2);
        attribute('bike-shadow', 'rx', 227 + Math.sin(pedalAngle * 2) * 2);

        const bellAge = (timestamp - bellStarted) / 1000;
        const bellActive = bellAge >= 0 && bellAge < 1.1;
        const bellFade = bellActive ? 1 - bellAge / 1.1 : 0;
        attribute('bike-bell', 'transform', `rotate(${Math.sin(bellAge * 48) * bellFade * 10 || 0} 718 414)`);
        attribute('bell-notes', 'opacity', bellFade);
        translate('bell-notes', bellActive ? bellAge * 12 : 0, bellActive ? -bellAge * 22 : 0);
      }

      function updatePlayback() {
        byId('pause-icon').toggleAttribute('hidden', !playing);
        byId('play-icon').toggleAttribute('hidden', playing);
        byId('toggle-label').textContent = playing ? '歇一会儿' : '继续出发';
        byId('toggle').setAttribute('aria-label', playing ? '暂停骑行' : '继续骑行');
        byId('toggle').setAttribute('aria-pressed', String(!playing));
        byId('ride-status').textContent = playing ? '海风正好，正在慢慢骑。' : '停下来，也有好风景。';
        redraw = true;
      }

      /** 声音仅在主动点击车铃后产生；音频不可用时仍显示车铃的视觉反馈。 */
      async function ringBell() {
        bellStarted = performance.now();
        redraw = true;
        byId('announcement').textContent = '叮铃，借过一下！';
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        try {
          audioContext ||= new AudioContextClass();
          await audioContext.resume();
          const start = audioContext.currentTime;
          [0, .14].forEach((delay) => {
            [1568, 3136].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              const envelope = audioContext.createGain();
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(frequency, start + delay);
              envelope.gain.setValueAtTime(0, start + delay);
              envelope.gain.linearRampToValueAtTime(index ? .025 : .07, start + delay + .006);
              envelope.gain.exponentialRampToValueAtTime(.0001, start + delay + .7);
              oscillator.connect(envelope);
              envelope.connect(audioContext.destination);
              oscillator.start(start + delay);
              oscillator.stop(start + delay + .72);
              oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
            });
          });
        } catch {
          // 浏览器禁止音频时，独立的 SVG 车铃动画仍然可用。
        }
      }

      byId('toggle').addEventListener('click', () => {
        userChosePlayback = true;
        playing = !playing;
        updatePlayback();
      });

      byId('pace').addEventListener('input', (event) => {
        speed = Number(event.target.value);
        const label = speed < .8 ? '兜风' : speed < 1.25 ? '悠闲' : speed < 1.6 ? '轻快' : '飞驰';
        byId('pace-label').textContent = label;
        event.target.setAttribute('aria-valuetext', `${label}，${speed.toFixed(2)} 倍速度`);
      });

      byId('ring').addEventListener('click', ringBell);
      motionPreference.addEventListener('change', () => {
        if (!userChosePlayback) {
          playing = !motionPreference.matches;
          updatePlayback();
        }
      });
      document.addEventListener('visibilitychange', () => { previousTimestamp = null; });

      function frame(timestamp) {
        const delta = previousTimestamp === null ? 0 : Math.min((timestamp - previousTimestamp) / 1000, .05);
        previousTimestamp = timestamp;
        if (playing) elapsed += delta * speed;
        if (playing || redraw || timestamp - bellStarted < 1200) {
          drawScene(elapsed, timestamp);
          redraw = false;
        }
        requestAnimationFrame(frame);
      }

      updatePlayback();
      drawScene(0, performance.now());
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
