<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d5e7e3">
  <title>鹈鹕的海岸骑行 · A little seaside ride</title>
  <style>
    :root { color-scheme: light; --ink: #204c50; --paper: #fcfaf0; --mint: #479b8c; --orange: #e8794e; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 28px 22px; background: #d5e7e3; color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { max-width: 1160px; margin: auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 5px 22px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-name { font-size: 13px; font-weight: 750; letter-spacing: .19em; }
    .brand-sub { margin-top: 4px; font-size: 10px; letter-spacing: .26em; }
    .masthead-note { font-family: Georgia, serif; font-size: 15px; font-style: italic; }
    .postcard { padding: 12px; background: var(--paper); border-radius: 8px; box-shadow: 0 24px 65px -35px #234c5066, 0 2px 6px #234c5012; }
    .picture { position: relative; overflow: hidden; background: #d8eeeb; border-radius: 3px; }
    .scene { display: block; width: 100%; height: auto; }
    .scene-copy { position: absolute; top: 7%; left: 5.4%; pointer-events: none; }
    .eyebrow { margin: 0 0 15px; font-size: clamp(8px, 1vw, 11px); font-weight: 650; letter-spacing: .29em; }
    h1 { margin: 0; font-family: "STKaiti", "KaiTi", "Songti SC", "SimSun", serif; font-size: clamp(25px, 4.3vw, 51px); font-weight: 500; line-height: 1.3; letter-spacing: .05em; }
    .subtitle { margin: 12px 0 0; font-family: Georgia, serif; font-size: clamp(11px, 1.4vw, 17px); font-style: italic; opacity: .73; }
    .corner-note { position: absolute; right: 3.7%; bottom: 4%; font-size: 10px; letter-spacing: .2em; writing-mode: vertical-rl; opacity: .55; }
    .controls { min-height: 90px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 15px 20px 5px; }
    .caption { margin: 0; font-size: 13px; letter-spacing: .05em; }
    .caption small { display: block; margin-top: 7px; font-family: Georgia, serif; font-size: 12px; font-style: italic; opacity: .6; letter-spacing: .03em; }
    .actions { display: flex; gap: 24px; align-items: center; }
    .speed { display: grid; grid-template-columns: auto auto; gap: 6px 16px; align-items: center; font-size: 11px; }
    output { text-align: right; font-variant-numeric: tabular-nums; min-width: 34px; }
    input[type="range"] { grid-column: 1 / -1; width: 140px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--mint); }
    .play { min-width: 102px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 30px; padding: 12px 18px; color: #fffdf4; background: var(--ink); cursor: pointer; transition: background .18s, transform .18s; }
    .play:hover { background: #346b67; transform: translateY(-1px); }
    .play:active { transform: translateY(1px); }
    .play svg { width: 15px; height: 15px; fill: currentColor; }
    [hidden] { display: none !important; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .footer { margin: 20px 0 0; display: flex; justify-content: space-between; padding: 0 5px; font-size: 10px; letter-spacing: .14em; opacity: .65; }
    @media (max-width: 650px) {
      body { padding: 20px 12px; }
      .masthead { padding-bottom: 17px; }
      .masthead-note { display: none; }
      .postcard { padding: 7px; }
      .scene { width: 150%; max-width: none; margin-left: -25%; }
      .scene-copy { top: 5%; left: 6%; }
      .eyebrow { margin-bottom: 10px; }
      .subtitle { margin-top: 8px; }
      .corner-note { display: none; }
      .controls { padding: 17px 10px 10px; flex-wrap: wrap; gap: 21px; }
      .caption { width: 100%; font-size: 12px; }
      .actions { width: 100%; justify-content: space-between; }
      .speed { width: 52%; }
      input[type="range"] { width: 100%; }
      .footer { font-size: 8px; letter-spacing: .08em; }
    }
    @media (prefers-reduced-motion: reduce) { .play { transition: none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const nodes = Object.fromEntries([
        'wheel-back', 'wheel-front', 'chainring', 'pelican', 'rider', 'shadow',
        'leg-near-outline', 'leg-near-color', 'leg-far-outline', 'leg-far-color',
        'foot-near', 'foot-far', 'clouds', 'islands', 'waves', 'road', 'verge',
        'scarf-tail', 'eye', 'boat', 'gulls', 'gull-one', 'gull-two'
      ].map(id => [id, byId(id)]));
      const playButton = byId('play');
      const speedInput = byId('speed');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let previousTime = null;
      let animationFrame = null;
      const TAU = Math.PI * 2;

      const transform = (id, value) => nodes[id].setAttribute('transform', value);
      // Repeat equal-width landscape tiles; their wrap happens outside the viewport.
      function scrollTile(id, distance, width = 1200) {
        transform(id, `translate(${-((distance % width + width) % width)} 0)`);
      }

      // Two-link leg geometry keeps both feet attached to their opposing pedals.
      // The right-facing knee solution gives this side-view rider a natural bend.
      function drawLeg(side, phase, bob) {
        const hip = { x: side === 'near' ? 530 : 523, y: 448 + bob };
        const foot = { x: 580 + 32 * Math.cos(phase), y: 585 + 32 * Math.sin(phase) };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 96;
        const lower = 91;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + (along * dx + bend * dy) / distance,
          y: hip.y + (along * dy - bend * dx) / distance
        };
        const path = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y - 6}`;
        nodes[`leg-${side}-outline`].setAttribute('d', path);
        nodes[`leg-${side}-color`].setAttribute('d', path);
        transform(`foot-${side}`, `translate(${foot.x} ${foot.y})`);
      }

      function drawScene() {
        const phase = time * 2.7;
        const wheelPhase = phase * 1.7;
        const travelled = wheelPhase * 98;
        const bob = Math.sin(phase * 2) * 2;
        const wheelDegrees = (wheelPhase % TAU) * 180 / Math.PI;
        transform('wheel-back', `rotate(${wheelDegrees})`);
        transform('wheel-front', `rotate(${wheelDegrees})`);
        transform('chainring', `rotate(${(phase % TAU) * 180 / Math.PI})`);
        transform('pelican', `translate(0 ${bob})`);
        drawLeg('far', phase + Math.PI, bob);
        drawLeg('near', phase, bob);
        scrollTile('road', travelled);
        scrollTile('verge', travelled);
        scrollTile('clouds', travelled * .035, 1400);
        scrollTile('islands', travelled * .055);
        scrollTile('waves', travelled * .16);
        const flutter = Math.sin(time * 7) * 6;
        nodes['scarf-tail'].setAttribute('d', `M580 338Q538 ${316 + flutter} 493 ${325 + flutter}L502 ${338 + flutter} 490 ${347 + flutter}Q539 ${342 - flutter * .5} 579 355Z`);
        const blinkPhase = time % 5.4;
        const eyeScale = blinkPhase > 4.9 && blinkPhase < 5.1 ? Math.max(.08, Math.abs(blinkPhase - 5) * 10) : 1;
        transform('eye', `translate(628 243) scale(1 ${eyeScale})`);
        transform('boat', `translate(${1025 + Math.sin(time * .16) * 17} ${441 + Math.sin(time * 1.5) * 2}) rotate(${Math.sin(time * 1.5) * 2})`);
        transform('gulls', `translate(${Math.sin(time * .3) * 14} ${Math.sin(time * 1.4) * 4})`);
        const wing = -9 + Math.sin(time * 3.5) * 6;
        nodes['gull-one'].setAttribute('d', `M878 274q13 ${wing} 25 0q12 ${wing} 25 0`);
        nodes['gull-two'].setAttribute('d', `M939 306q9 ${wing * .75} 18 0q9 ${wing * .75} 18 0`);
      }

      // A single clock drives the scene; pause and speed affect every moving part.
      function frame(now) {
        animationFrame = null;
        if (!playing || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) time += Math.min((now - previousTime) / 1000, .05) * speed;
        previousTime = now;
        drawScene();
        animationFrame = requestAnimationFrame(frame);
      }

      function scheduleFrame() {
        if (playing && !document.hidden && animationFrame === null) animationFrame = requestAnimationFrame(frame);
      }

      function syncControls() {
        byId('pause-icon').toggleAttribute('hidden', !playing);
        byId('play-icon').toggleAttribute('hidden', playing);
        byId('play-label').textContent = playing ? '暂停' : '继续骑行';
        playButton.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      }

      function setPlaying(value) {
        playing = value;
        previousTime = null;
        if (!playing && animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        syncControls();
        scheduleFrame();
      }

      playButton.addEventListener('click', () => setPlaying(!playing));
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').textContent = `${speed.toFixed(2).replace(/0$/, '')}×`;
        speedInput.setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      document.addEventListener('visibilitychange', () => {
        previousTime = null;
        if (document.hidden && animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
        scheduleFrame();
      });
      motionPreference.addEventListener('change', event => setPlaying(!event.matches));
      drawScene();
      syncControls();
      scheduleFrame();
    })();
  </script>
</body>
</html>
