# 自动测试必须固定使用 Mock Provider，禁止调用真实模型并产生费用。
app.provider.mode=mock
app.provider.concurrency.store-mode=MEMORY
# 普通自动测试不继承部署环境中的真实短信/邮件投递开关，不读取云凭据或产生费用。
# 专项适配器测试通过自己的显式属性和 Mock 客户端覆盖，生产资源不包含本文件。
app.security.sms.enabled=false
app.security.registration.delivery-mode=disabled
# 每个测试上下文使用独立构建产物目录；虚拟 TestActors 不能进入开发实例的永久补写队列。
# 真实数据库/浏览器验收可通过 DynamicPropertySource 显式覆盖为自己的独立目录。
app.analytics.delivery.journal-directory=${user.dir}/target/test-analytics-journal/${random.uuid}
decorator.datasource.enabled=false
