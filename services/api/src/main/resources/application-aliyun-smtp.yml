# 显式启用 aliyun-smtp profile 才切换到阿里云华东 1（杭州）；不覆盖通用 SMTP 默认值。
# 发信地址、SMTP 密码和验证码摘要密钥仍从后端环境变量注入。
spring:
  mail:
    host: ${SMTP_HOST:smtpdm.aliyun.com}
    port: ${SMTP_PORT:465}
    # 兼容已有部署仅提供发信地址的环境；阿里云 SMTP 认证账号就是该已验证地址。
    # 显式 SMTP_USERNAME 优先，显式空值仍视为配置错误，不静默选择另一账号。
    username: ${SMTP_USERNAME:${EMAIL_FROM_ADDRESS:}}
    properties:
      mail:
        smtp:
          # 465 使用连接建立时的 TLS，不是 587 的 STARTTLS 升级流程。
          ssl:
            enable: true
          starttls:
            enable: false
            required: false

app:
  security:
    registration:
      delivery-mode: ${EMAIL_DELIVERY_MODE:smtp}
