spring:
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

app:
  trial:
    store-mode: MEMORY
  text-polish:
    # 无Redis的显式演示环境使用内存，普通运行仍要求私有Redis状态。
    store-mode: MEMORY
  image-prompt:
    store-mode: MEMORY
  provider:
    concurrency:
      store-mode: MEMORY
  history:
    enabled: false
  security:
    login-guard:
      require-redis: false
