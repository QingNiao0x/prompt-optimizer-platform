spring:
  session:
    store-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

app:
  image-prompt:
    store-mode: MEMORY
  provider:
    concurrency:
      store-mode: MEMORY
  history:
    enabled: false
  security:
    login-guard:
      require-redis: false
