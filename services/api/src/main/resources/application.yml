spring:
  application:
    name: prompt-optimizer-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prompt_optimizer}
    username: ${DB_USERNAME:prompt_optimizer}
    password: ${DB_PASSWORD:Admin@123}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie
      timeout: ${AUTH_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  tomcat:
    # 大项目上下文可能一次性提交数百个文件，放宽默认 2MB 请求体限制。
    max-swallow-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"

app:
  planning:
    store-mode: ${PLANNING_STORE_MODE:LOCAL_FALLBACK}
  demo:
    # 仅供数据库演示种子和显式 local-mock profile 使用；普通请求身份来自 Spring Security。
    tenant-id: ${DEMO_TENANT_ID:00000000-0000-0000-0000-000000000001}
    user-id: ${DEMO_USER_ID:00000000-0000-0000-0000-000000000002}
    workspace-id: ${DEMO_WORKSPACE_ID:00000000-0000-0000-0000-000000000003}
  security:
    # API Key 加密主密钥，由运行环境注入，禁止写入源码或提交到 Git。
    api-key-encryption-secret: ${API_KEY_ENCRYPTION_SECRET:}
    cors:
      # 仅为跨域前端显式配置；留空时不开放跨域请求。
      allowed-origin: ${AUTH_CORS_ALLOWED_ORIGIN:}
    # 完整数据库模式首次启动时，只在种子账户尚无密码哈希的情况下写入一次。
    bootstrap-user:
      email: ${BOOTSTRAP_USER_EMAIL:demo@local}
      password: ${BOOTSTRAP_USER_PASSWORD:}
    # local-mock 不连接数据库，但仍要求显式密码，避免退化为匿名固定用户。
    local-user:
      email: ${LOCAL_AUTH_EMAIL:demo@local}
      password: ${LOCAL_AUTH_PASSWORD:}
      display-name: ${LOCAL_AUTH_DISPLAY_NAME:Local Demo User}
    registration:
      enabled: ${EMAIL_REGISTRATION_ENABLED:true}
      # disabled / log / smtp。log 会输出验证码，只允许本地开发显式启用。
      delivery-mode: ${EMAIL_DELIVERY_MODE:disabled}
      verification-secret: ${EMAIL_VERIFICATION_SECRET:}
      from-address: ${EMAIL_FROM_ADDRESS:${SMTP_USERNAME:}}
      code-ttl: ${EMAIL_CODE_TTL:5m}
      resend-interval: ${EMAIL_CODE_RESEND_INTERVAL:60s}
      max-attempts: ${EMAIL_CODE_MAX_ATTEMPTS:5}
      email-hourly-limit: ${EMAIL_CODE_EMAIL_HOURLY_LIMIT:5}
      ip-hourly-limit: ${EMAIL_CODE_IP_HOURLY_LIMIT:20}
      # 多实例或公网环境必须保持 true，避免 Redis 故障时各实例分别放宽限流。
      require-redis: ${EMAIL_VERIFICATION_REQUIRE_REDIS:true}
  history:
    # local-mock 无数据库模式下关闭历史持久化，避免启动失败。
    enabled: ${HISTORY_ENABLED:true}
  retrieval:
    semantic:
      # 语义向量模型与聊天模型相互独立。默认关闭，未配置时继续使用现有关键词检索。
      enabled: ${SEMANTIC_RETRIEVAL_ENABLED:false}
      # 默认指向本机 OpenAI 兼容端点；使用远程服务前需要确认项目内容传输与隐私策略。
      endpoint: ${EMBEDDING_ENDPOINT:http://localhost:11434/v1/embeddings}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:embeddinggemma}
      batch-size: ${EMBEDDING_BATCH_SIZE:16}
      max-batch-characters: ${EMBEDDING_MAX_BATCH_CHARACTERS:48000}
      connect-timeout: ${EMBEDDING_CONNECT_TIMEOUT:3s}
      read-timeout: ${EMBEDDING_READ_TIMEOUT:45s}
  summary:
    map-reduce:
      # 会对全文分批调用当前聊天模型，默认关闭以避免用户上传文件时产生意外费用。
      enabled: ${MAP_REDUCE_SUMMARY_ENABLED:false}
      map-batch-size: ${MAP_REDUCE_MAP_BATCH_SIZE:8}
      reduce-batch-size: ${MAP_REDUCE_REDUCE_BATCH_SIZE:24}
      max-batch-characters: ${MAP_REDUCE_MAX_BATCH_CHARACTERS:48000}
      intermediate-summary-characters: ${MAP_REDUCE_INTERMEDIATE_CHARACTERS:1200}
      final-summary-characters: ${MAP_REDUCE_FINAL_CHARACTERS:1800}
      # 超大文档超过调用保护上限后继续使用本地规则摘要，不跳过剩余全文块。
      max-map-calls: ${MAP_REDUCE_MAX_MAP_CALLS:256}
      max-reduce-calls: ${MAP_REDUCE_MAX_REDUCE_CALLS:32}
  provider:
    mode: ${MODEL_PROVIDER_MODE:openai-compatible}
    openai-compatible:
      provider-name: ${MODEL_PROVIDER_NAME:deepseek}
      # 当前适配器会直接 POST 到该地址，不会自动拼接 /chat/completions。
      endpoint: ${MODEL_ENDPOINT:https://api.deepseek.com/chat/completions}
      api-key: ${MODEL_API_KEY:}
      model: ${MODEL_NAME:deepseek-chat}
      # 逗号分隔的服务端模型白名单；例如 TokenHub 可填写四个模型 ID。
      models: ${MODEL_MODELS:}
      # 是否启用按模型路由到不同 endpoint/API Key 的模式
      multi-provider-enabled: ${MODEL_MULTI_PROVIDER_ENABLED:true}
      default-provider: ${MODEL_DEFAULT_PROVIDER:tokenhub}
      # 保留已配置的 DeepSeek 路由，但默认将旧 deepseek-chat 从用户模型目录中下架。
      # 同时支持写入原始模型 ID，以兼容单供应商模式。
      model-catalog-hidden-ids: ${MODEL_CATALOG_HIDDEN_IDS:deepseek:deepseek-chat,deepseek-chat}
      # 将 TokenHub 放在前面，使未显式配置 MODEL_DEFAULT_PROVIDER 时优先使用其默认模型。
      providers:
        tokenhub:
          provider-name: ${MODEL_TOKENHUB_PROVIDER_NAME:tokenhub}
          endpoint: ${MODEL_TOKENHUB_ENDPOINT:https://tokenhub.tencentmaas.com/v1/chat/completions}
          api-key: ${MODEL_TOKENHUB_API_KEY:${MODEL_API_KEY2:}}
          model: ${MODEL_TOKENHUB_NAME:deepseek-v4-pro-0813}
          # TokenHub 的调用 ID 与下方客户展示名分离；应用要求展示的基础模型会与此列表合并。
          models: ${MODEL_TOKENHUB_MODELS:deepseek/deepseek-flash,deepseek-v4-pro-0813,kimi-k3,kimi-k2.8-preview,kimi-k2.7-code,glm-5.3,glm-5.3-flashx,hy4-preview,hy3,minimax-m3}
        deepseek:
          provider-name: ${MODEL_DEEPSEEK_PROVIDER_NAME:deepseek}
          endpoint: ${MODEL_DEEPSEEK_ENDPOINT:${MODEL_ENDPOINT:https://api.deepseek.com/chat/completions}}
          # 兼容原有单供应商配置；多供应商模式下建议显式设置 MODEL_DEEPSEEK_API_KEY。
          api-key: ${MODEL_DEEPSEEK_API_KEY:${MODEL_API_KEY:}}
          model: ${MODEL_DEEPSEEK_NAME:${MODEL_NAME:deepseek-chat}}
          models: ${MODEL_DEEPSEEK_MODELS:${MODEL_MODELS:}}
      temperature: ${MODEL_TEMPERATURE:0.2}
      # 输出最大TOKEN
      max-tokens: ${MODEL_MAX_TOKENS:10000}
      connect-timeout: ${MODEL_CONNECT_TIMEOUT:3s}
      # 结构化提示词生成偶尔会超过 30 秒；浏览器端等待 70 秒，必须留出错误响应返回的时间。
      read-timeout: ${MODEL_READ_TIMEOUT:60s}
      json-response-format-enabled: ${MODEL_JSON_RESPONSE_FORMAT_ENABLED:true}
