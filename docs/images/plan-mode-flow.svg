<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
  <title id="title">直接增强与 Plan Mode 确认流程</title>
  <desc id="desc">输入原始提示词并按需添加材料。默认关闭 Plan，检索上下文后直接增强。开启 Plan 后先准备安全上下文并生成确认问题；有问题时逐题作答、核对答案并确认生成，没有问题时直接进入最终生成。随后获取最终相关上下文，生成优化提示词，供用户审阅、编辑、复制或再次增强。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; text-anchor: middle; fill: #172554; }
      .heading { font-size: 25px; font-weight: 700; }
      .detail { font-size: 20px; fill: #475569; }
      .label { font-size: 20px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; }
      .plan { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="1040" fill="#fff"/>

  <rect class="box" x="320" y="26" width="480" height="84" rx="14"/>
  <text class="heading" x="560" y="61">输入原始提示词</text>
  <text class="detail" x="560" y="90">按需添加材料与补充说明</text>
  <path class="line" d="M 560 110 V 145"/>
  <path d="M 560 148 L 704 205 L 560 262 L 416 205 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="560" y="214">开启 Plan？</text>

  <path class="line" d="M 416 205 H 246 V 306"/>
  <text class="label" x="342" y="257">关闭（默认）</text>
  <path class="line" d="M 704 205 H 792 V 306"/>
  <text class="label" x="834" y="257">开启</text>

  <rect class="box" x="58" y="308" width="376" height="112" rx="14"/>
  <text class="heading" x="246" y="351">直接增强</text>
  <text class="detail" x="246" y="385">检索相关上下文并生成优化提示词</text>

  <rect class="plan" x="560" y="308" width="464" height="112" rx="14"/>
  <text class="heading" x="792" y="351">准备确认问题</text>
  <text class="detail" x="792" y="385">结合原始提示词与安全上下文</text>
  <path class="line" d="M 792 420 V 454"/>
  <path d="M 792 456 L 930 509 L 792 562 L 654 509 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="792" y="518">有确认问题？</text>

  <path class="line" d="M 792 562 V 600"/>
  <text class="label" x="824" y="589">有</text>
  <rect class="plan" x="560" y="602" width="464" height="110" rx="14"/>
  <text class="heading" x="792" y="640">逐题作答并核对答案</text>
  <text class="detail" x="792" y="677">最多 8 题，确认后点击“生成最终提示词”</text>
  <path class="line" d="M 792 712 V 752"/>

  <path class="line" d="M 930 509 H 1070 V 798 H 1026"/>
  <rect x="1035" y="530" width="70" height="36" rx="8" fill="#fff"/>
  <text class="label" x="1070" y="555">无</text>
  <rect class="plan" x="560" y="754" width="464" height="90" rx="14"/>
  <text class="heading" x="792" y="790">获取最终相关上下文</text>
  <text class="detail" x="792" y="823">结合确认信息生成并校验优化提示词</text>

  <path class="line" d="M 246 420 V 884 H 560 V 917"/>
  <path class="line" d="M 792 844 V 884 H 560 V 917"/>
  <rect x="270" y="919" width="580" height="92" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="560" y="956">审阅结果与待确认事项</text>
  <text class="detail" x="560" y="989">按需编辑、复制优化提示词，或再次增强</text>
</svg>
