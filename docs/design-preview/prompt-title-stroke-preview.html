<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt title stroke preview</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#191b20;--code:#0c0f14;--line:#303640;--text:#dce1ea;--muted:#a6afbd;--soft:#8993a3;--mono:"JetBrains Mono",Consolas,monospace;--sans:"Space Grotesk","Noto Sans SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--muted);font-family:var(--sans);background:radial-gradient(circle at 80% 0%,#6f7cff24,transparent 28rem),linear-gradient(#808daa0b 1px,transparent 1px),linear-gradient(90deg,#808daa0b 1px,transparent 1px),var(--bg);background-size:auto 34px,34px 34px,34px 34px}.page{width:min(1080px,calc(100% - 36px));margin:auto;padding:58px 0 72px}.eyebrow{margin:0 0 12px;color:#65d8d0;font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase}h1{margin:0;color:var(--text);font-size:clamp(30px,5vw,56px);line-height:1.12}.intro{max-width:680px;margin:16px 0 0;font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:34px}.preview{min-height:330px;padding:clamp(24px,4vw,38px);border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 22px 60px #00000038}.hero{display:grid;align-content:center;background:linear-gradient(135deg,#6f7cff1f,transparent 48%),var(--panel)}.label{display:flex;justify-content:space-between;margin-bottom:30px;color:var(--soft);font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.label:after{width:56px;height:1px;background:#414957;content:""}.title{display:grid;gap:7px;margin:0;font-size:clamp(28px,4vw,46px);font-weight:600;line-height:1.16}.title span,.editor-title span{display:block}.primary{color:var(--text);-webkit-text-stroke:.45px #6f7cff6b;text-shadow:0 1px #ffffff0d,0 0 18px #6f7cff14}.secondary{color:#aeb7c8;-webkit-text-stroke:.45px #65d8d057;text-shadow:0 0 14px #65d8d00f}.editor{display:grid;grid-template-rows:auto 1fr auto;gap:22px;background:var(--code)}.bar{display:flex;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid var(--line);color:var(--soft);font:10px var(--mono)}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#414957}.dots i:first-child{background:#e8b45c}.dots i:last-child{background:#65d8d0}.editor-title{align-self:center;margin:0;color:var(--text);font-size:clamp(25px,3.4vw,38px);font-weight:600;line-height:1.2;-webkit-text-stroke:.3px #6f7cff52;text-shadow:0 0 12px #6f7cff0f}.editor-title span:last-child{color:#aeb7c8}.footer{display:flex;gap:8px;color:var(--soft);font:10px var(--mono)}.footer b{color:#65d8d0;font-weight:500}.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:16px;background:var(--line)}.spec{display:grid;gap:5px;padding:15px;background:var(--panel)}.spec small{color:var(--soft);font:10px var(--mono)}.spec strong{color:var(--text);font:12px var(--mono)}@media(max-width:720px){.page{width:calc(100% - 28px);padding-top:34px}.grid,.specs{grid-template-columns:1fr}.preview{min-height:280px;padding:24px}}
</style></head><body><main class="page"><p class="eyebrow">QingNiao Midnight Workbench / Type Preview</p><h1>提示词标题描边效果预览</h1><p class="intro">当前预览仅保留文案本身。描边采用低强度蓝紫与青色边缘，避免标题变成厚重的装饰字。</p><section class="grid" aria-label="文字排版预览"><article class="preview hero"><div class="label">宣传图强调版</div><h2 class="title"><span class="primary">把想法写下来。</span><span class="secondary">工程细节，交给上下文。</span></h2></article><article class="preview editor"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span>prompt-workbench / intent</span></div><h2 class="editor-title"><span>把想法写下来。</span><span>工程细节，交给上下文。</span></h2><div class="footer"><b>● READY</b><span>context-aware prompt engineering</span></div></article></section><section class="specs"><div class="spec"><small>主标题描边</small><strong>0.45px · #6f7cff6b</strong></div><div class="spec"><small>副标题描边</small><strong>0.45px · #65d8d057</strong></div><div class="spec"><small>编辑器标题</small><strong>0.30px · #6f7cff52</strong></div></section></main></body></html>
